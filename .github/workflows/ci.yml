name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  formatting:
    name: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just@1.58.0,rumdl@0.2.77,typos-cli@1.47.2
      - run: just fmt-check
      - run: typos --config .config/typos.toml
  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.toolchain }})
    defaults:
      run:
        shell: bash
    env:
      TOOLCHAIN: ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: '1.98.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo "+$TOOLCHAIN" test --all-targets --all-features --locked
      - run: cargo "+$TOOLCHAIN" test --doc --all-features --locked
      - run: cargo "+$TOOLCHAIN" test --no-default-features --lib --tests --locked
      - run: cargo "+$TOOLCHAIN" check --no-default-features --all-targets --locked
  clippy:
    name: clippy (${{ matrix.toolchain }})
    env:
      TOOLCHAIN: ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo "+$TOOLCHAIN" clippy --all-targets --all-features --locked -- -D warnings
  documentation:
    name: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - run: rustup toolchain install stable --profile minimal
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just@1.58.0,cargo-rdme@2.2.3
      - run: rustup toolchain install nightly nightly-2026-08-05 --profile minimal
      - run: python3 scripts/check-sticky-media.py
      - run: just docs docs-rs readme-check
      - run: cargo package --locked
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: just@1.58.0,cargo-deny@0.20.2,zizmor@1.26.1
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: just ci-check zizmor deny
        env:
          GH_TOKEN: ${{ github.token }}
  semver:
    name: semver
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-semver-checks@0.49.0
      # cargo-semver-checks 0.49 supports the Rust 1.98 rustdoc JSON format.
      - run: rustup toolchain install 1.98.0 --profile minimal
      - name: Check against the latest published release when available
        run: |
          set -euo pipefail
          baseline=$(python3 scripts/published-version.py)
          if [ -n "$baseline" ]; then
            cargo +1.98.0 semver-checks --baseline-version "$baseline"
          else
            echo 'No published baseline yet; initial release.'
          fi
  terminal-acceptance:
    name: terminal acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BETAMAX_VERSION: 0.1.22
      BETAMAX_REVISION: 5650cb1ebcf7251b34ee9e9f70bfe7bb3f3242b2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install the published Betamax binary
        run: |
          curl --fail --location --retry 3 \
            https://github.com/joshka/betamax/releases/download/betamax-v0.1.22/betamax-0.1.22-x86_64-unknown-linux-gnu.tgz \
            --output "$RUNNER_TEMP/betamax.tgz"
          echo '497c0bbf6da724e90be49e48ade317d99567e4b03e4e86f03c0dac691ec6358f  '"$RUNNER_TEMP/betamax.tgz" | sha256sum --check
          mkdir "$RUNNER_TEMP/betamax"
          tar --extract --gzip --file "$RUNNER_TEMP/betamax.tgz" --directory "$RUNNER_TEMP/betamax"
          echo "BETAMAX=$RUNNER_TEMP/betamax/betamax" >> "$GITHUB_ENV"
      - run: cargo build --example viewer --locked
      - run: python3 scripts/terminal-ux.py
      - name: Resolve the viewer for the sticky-header acceptance tape
        run: echo "RATATUI_DIFF_VIEWER=$GITHUB_WORKSPACE/target/debug/examples/viewer" >> "$GITHUB_ENV"
      - name: Sticky-header acceptance and review gallery
        uses: joshka/betamax-action@4f9e3b05a390d0bb16e72af92e3995541a532c79
        env:
          BETAMAX_FAILURE_DIR: media/terminal-ux/sticky/failures
        with:
          version: 0.1.22
          sha256: 497c0bbf6da724e90be49e48ade317d99567e4b03e4e86f03c0dac691ec6358f
          tapes: examples/terminal-ux-sticky.tape
          formats: png
          extra-outputs: media/terminal-ux/sticky/*.png
          comment-key: sticky-headers
      - run: cargo build --example viewer --features syntax --locked
      - run: python3 scripts/capture.py examples/syntax-interaction.tape
      - name: Retain terminal checkpoints and failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terminal-acceptance
          path: media/terminal-ux/
          if-no-files-found: warn
          retention-days: 14
  required:
    name: required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [formatting, tests, clippy, documentation, policy, semver, terminal-acceptance]
    if: ${{ always() }}
    steps:
      - name: Require all blocking jobs to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              raise SystemExit(str(failed))
          PY
