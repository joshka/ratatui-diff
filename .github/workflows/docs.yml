name: Docs site
# Builds the Astro/Starlight site in site/ and publishes it to GitHub Pages, served under the
# joshka.github.io user site's custom domain at https://www.joshka.net/ratatui-diff/.
on:
  pull_request:
    paths:
      - .github/workflows/docs.yml
      - site/**
      - src/**
      - examples/**
      - docs/assets/**
      - scripts/capture*.py
      - scripts/site-media.py
      - scripts/check-site-snippets.py
      - Cargo.toml
      - Cargo.lock
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    name: build docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - run: rustup toolchain install stable --profile minimal
      - name: Install the published Betamax binary and capture font
        run: |
          sudo apt-get update
          # Noto CJK supplies glyphs for the Unicode fixtures that JetBrains Mono lacks.
          sudo apt-get install --yes fonts-jetbrains-mono fonts-noto-cjk
          curl --fail --location --retry 3 \
            https://github.com/joshka/betamax/releases/download/betamax-v0.1.22/betamax-0.1.22-x86_64-unknown-linux-gnu.tgz \
            --output "$RUNNER_TEMP/betamax.tgz"
          echo '497c0bbf6da724e90be49e48ade317d99567e4b03e4e86f03c0dac691ec6358f  '"$RUNNER_TEMP/betamax.tgz" | sha256sum --check
          mkdir "$RUNNER_TEMP/betamax"
          tar --extract --gzip --file "$RUNNER_TEMP/betamax.tgz" --directory "$RUNNER_TEMP/betamax"
          echo "$RUNNER_TEMP/betamax" >> "$GITHUB_PATH"
      - name: Capture site screenshots from the tapes
        run: python3 scripts/site-media.py
      - name: Compile and run site code snippets
        run: python3 scripts/check-site-snippets.py
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install site dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile
      - name: Check site
        working-directory: site
        run: pnpm check
      - name: Build site
        working-directory: site
        run: pnpm build
      - name: Verify built media are real images
        run: python3 scripts/site-media.py --check site/dist
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
  deploy:
    name: deploy docs
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # Publish the uploaded artifact to GitHub Pages.
      id-token: write # Custom Pages workflows also require an OIDC token.
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
